resolution: ${augmentation.resolution}
total_epochs: ${total_epochs}
freeze_encoder: false
lr_update_interval: step

model:
  _target_: segmentation_models_pytorch.MAnet
  encoder_name: tu-convnextv2_nano
  encoder_weights: imagenet
  in_channels: 3
  classes: 1

optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  weight_decay: 1.0

scheduler:
  _target_: mltools.seg.schedulers.warmup_cosine_scheduler.get_cosine_schedule_with_warmup
  num_epochs: ${total_epochs}
  num_warmup_epochs: 5
  num_cycles: 0.5
  last_epoch: -1

# scheduler:
  # _target_: torch.optim.lr_scheduler.LinearLR
  # start_factor: 1.0
  # end_factor: 0.1
  # total_iters is set in the module as 0.5 of all epochs

loss:
  weight: 0.5
  labels_smoothing: 0.05
hydra:
  run:
    # This changes where the .hydra/ folder and logs go
    dir: experiments/light/${now:%Y-%m-%d}/${now:%H-%M-%S}

defaults:
  - dataset: Min512
  - preprocessing: default
  - augmentation: default
  - module: default
  - _self_

fold: 0
batch_size: 20
total_epochs: 100

class_name: "wood_knot"
class_groups: null

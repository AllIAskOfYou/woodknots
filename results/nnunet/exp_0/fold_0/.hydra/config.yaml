paths:
  project_root: ${oc.env:PWD}
  data_root: ${paths.project_root}/data
  results_root: ${paths.project_root}/results
  run_dir: ${paths.results_root}/${framework}/${experiment.name}/fold_${experiment.fold}
  nnunet:
    data_root: ${paths.data_root}/nnunet_format
    raw: ${paths.nnunet.data_root}/raw
    preprocessed: ${paths.nnunet.data_root}/preprocessed
    results: ${paths.run_dir}/nnunet_native
dataset:
  name: woodknots
  hf_repo_id: Elercast/WoodKnots-600
  hf_revision: v1.0
  data_root: ${paths.data_root}
  folds:
    file_path: ${paths.project_root}/common/data_splits/split_k5_s42.json
    k: 5
  class_names:
  - wood_knot
  resolution: 256
  id: 0
experiment:
  name: exp_0
  fold: 0
framework: nnunet
time: ${now:%Y-%m-%d_%H-%M-%S}
seed: 42

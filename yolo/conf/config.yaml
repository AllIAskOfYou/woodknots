defaults:
  - env
  - dataset: woodknots
  - train: default
  - experiment: ???
  - _self_

dataset:
  label:
    wood_knot_categorization: combined
    wood_knot_confidences: [0.2, 0.6, 1.0]
    primary_log: false

framework: "yolo"
time: ${now:%Y-%m-%d_%H-%M-%S}

experiment:
  name: ${hydra:runtime.choices.experiment}

paths:
  run_dir: ${paths.results_root}/${framework}/${experiment.name}/fold_${experiment.fold}


hydra:
  searchpath:
    - file://${oc.env:PWD}/common/conf
  run:
    dir: ${paths.run_dir}
  job:
    chdir: false

[project]
name = "mltools"
version = "0.1.0"
description = "Tools for ml tasks."
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "torch>=2.14.0",
    "torchvision",
    "albumentations",
    "hydra-core",
    "ipykernel",
    "lightning",
    "matplotlib",
    "monai",
    "pycocotools",
    "python-dotenv",
    "segmentation-models-pytorch",
    "soundfile",
    "tensorboard",
    "tifffile",
    "ultralytics",
    "setuptools<82.0.0",
    "opencv-python>=4.13.0.92",
    "transformers>=5.12.0",
    "huggingface-hub[cli]>=1.19.0",
    "fpdf>=1.7.2",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "nnunetv2>=2.8.1",
    "prtpy>=0.8.3",
    "ortools>=9.15.6755",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

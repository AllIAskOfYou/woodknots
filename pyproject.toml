[project]
name = "mltools"
version = "0.1.0"
description = "Tools for ml tasks."
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "albumentations",
    "hydra-core",
    "ipykernel>=7.2.0",
    "lightning",
    "matplotlib>=3.10.8",
    "monai",
    "pycocotools",
    "python-dotenv",
    "segmentation-models-pytorch",
    "setuptools<82.0.0",
    "soundfile>=0.13.1",
    "tensorboard>=2.20.0",
    "tifffile>=2026.3.3",
    "ultralytics>=8.4.37",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

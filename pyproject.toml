
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true # Only use this index when explicitly requested

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }


[project]
name = "mltools"
version = "0.1.0"
description = "Tools for ml tasks."
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "torch",
    "torchvision",
    "albumentations",
    "hydra-core",
    "ipykernel",
    "lightning",
    "matplotlib",
    "monai",
    "pycocotools",
    "python-dotenv",
    "segmentation-models-pytorch",
    "soundfile",
    "tensorboard",
    "tifffile",
    "ultralytics",
    "setuptools<82.0.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

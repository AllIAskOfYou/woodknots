[project]
name = "logs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "albumentations>=2.0.8",
    "lightning>=2.6.1",
    "pycocotools>=2.0.11",
    "python-dotenv>=1.2.2",
    "segmentation-models-pytorch>=0.5.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
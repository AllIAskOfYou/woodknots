[project]
name = "mltools"
version = "0.1.0"
description = "Tools for ml tasks."
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "torch",
    "torchvision",
    "albumentations",
    "hydra-core",
    "ipykernel",
    "lightning",
    "matplotlib",
    "monai",
    "pycocotools",
    "python-dotenv",
    "segmentation-models-pytorch",
    "soundfile",
    "tensorboard",
    "tifffile",
    "ultralytics",
    "setuptools<82.0.0",
    "opencv-python>=4.13.0.92",
    "transformers>=5.12.0",
    "huggingface-hub[cli]>=1.19.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

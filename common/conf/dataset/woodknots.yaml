name: woodknots
hf_repo_id: "Elercast/WoodKnots-600"
hf_revision: "v1.0"
data_root: ${paths.data_root}
folds:
  file_path: ${paths.project_root}/common/data_splits/split_k5_s42_optimal.json
  k: 5
  # train_val_test: val = partition i selects the checkpoint, test = partition
  #   (i+1)%k, train = the remaining k-2.
  # train_test:     no selection — the val partition joins training, the final
  #   epoch is kept, and val metrics are logged on the test partition for
  #   inspection only. The test partition is the same in both modes.
  # Read by the seg framework only; yolo and nnU-Net always split three ways.
  mode: train_val_test
class_names: ["wood_knot"] # ["primary_log", "wood_knot"]
# Annotations that count as ground truth in the evaluation, for every framework
# (knot annotator confidence). How a framework is TRAINED is set separately in
# its own config (seg: train.class_groups, yolo: dataset.label).
eval_confidences: [0.2, 0.6, 1.0]
resolution: ??? # shorter side of every image after resizing (aspect ratio kept)
defaults:
  - env
  - dataset: woodknots
  # _self_ before experiment: experiment files must be able to override
  # root keys set here (e.g. seed). With _self_ last, this file's values
  # silently won over the experiment's.
  - _self_
  - experiment: ???


framework: "nnunet"
time: ${now:%Y-%m-%d_%H-%M-%S}

experiment:
  name: ${hydra:runtime.choices.experiment}

paths:
  run_dir: ${paths.results_root}/${framework}/${experiment.name}/fold_${experiment.fold}
  nnunet:
    data_root: ${paths.data_root}/nnunet_format
    raw: ${paths.nnunet.data_root}/raw
    preprocessed: ${paths.nnunet.data_root}/preprocessed
    results: ${paths.run_dir}/nnunet_native


hydra:
  searchpath:
    - file://${oc.env:PWD}/common/conf
  run:
    dir: ${paths.run_dir}
  job:
    chdir: false
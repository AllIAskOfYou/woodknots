# @package _global_
# Mask2Former at its library defaults (exp_decoder_2/3/4: shrunk decoder)
#
# exp_decoder_2..4 cut every capacity knob — 10 queries, hidden_dim 128, 4
# decoder / 3 encoder layers, dim_feedforward 512 — on the assumption that
# Mask2Former's COCO/ADE20K-scale decoder overfits a few hundred training
# images. This run leaves all of them at the values DINOv3Mask2Former (and
# Mask2FormerConfig) default to, so the shrinking is measured rather than
# assumed: num_queries 100, hidden_dim 256, decoder_layers 10,
# encoder_layers 6, dim_feedforward 2048, encoder_feedforward_dim 1024,
# feature_size 256, mask_feature_size 256, no_object_weight 0.1.
#
# Only num_classes is set, so any default that changes upstream changes here
# too — which is the point of the comparison.
experiment:
  fold: ???
dataset:
  resolution: 512

train:
  # Mask2Former's final predictions are its whole-image instance pass, so
  # select the checkpoint on whole-image inference too (as exp_decoder_2..4).
  inference: whole_image
  model:
    _target_: mltools.seg.models.DINOv3Mask2Former
    num_classes: 1
    num_queries: 10
    no_object_weight: 1.0
  batch_size: 20
  # weight_decay stays at the default 1.0 — 0.05 was measurably worse

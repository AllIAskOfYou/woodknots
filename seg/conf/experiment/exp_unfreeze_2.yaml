# fine-tune the deepest encoder stage only (3 of 4 stages stay frozen)
# Derived from exp_reference: only encoder freezing differs.
experiment:
  fold: ???
dataset:
  resolution: 512

train:
  unfreeze_stages: [3]
  optimizer:
    encoder_lr: 1.0e-5   # 10x below the decoder lr, standard for fine-tuning
    encoder_weight_decay: 0.05
  total_epochs: 200

# @package _global_
experiment:
  fold: ???
dataset:
  resolution: 512

train:
  model:
    _target_: mltools.seg.models.DINOv3Mask2Former
    num_classes: 1
    num_queries: 10            # mean 2 objects/image, max 16
    hidden_dim: 128            # 256 -> 128
    decoder_layers: 4          # 10 -> 4
    encoder_layers: 3          # 6 -> 3
    dim_feedforward: 512       # 2048 -> 512
    encoder_feedforward_dim: 512
    feature_size: 128
    mask_feature_size: 128
  batch_size: 20
  # weight_decay stays at the default 1.0 — 0.05 was measurably worse

class_name: wood_knot
class_groups:
  - value: 1.0
    classes: [0.2, 0.6, 1.0]

resolution: ${dataset.resolution}
total_epochs: 100
batch_size: 20
# Validation metric the kept checkpoint is selected on (higher is better):
#   val_dice            background-inclusive, averaged over images — an image
#                       with no knots and no prediction scores a perfect 1.0
#   val_dice_fg_pooled  foreground only, summed over the validation set and
#                       divided once; empty images contribute only their false
#                       positives
#   val_iou, val_gms    the other per-image metrics
checkpoint_metric: val_dice_fg_pooled
# First epoch that actually validates; using warmup, also matters for model
# selection.
validate_from_epoch: 0
# Additionally save checkpoints/final.ckpt with the last epoch's weights, for
# comparing checkpoint selection against just taking the end of training.
# ModelCheckpoint's own last.ckpt does NOT hold them: it is written only on
# epochs that also wrote the best checkpoint, so it is byte-identical to it.
# Implied by dataset.folds.mode=train_test, which predicts from final.ckpt.
save_final_checkpoint: false
# Exponential moving average of the weights, updated once per epoch and written
# as final.ckpt in place of the raw final weights. null disables it. decay d
# averages a trailing window of roughly 1/(1-d) epochs (0.9 -> ~10, 0.95 -> ~20)
# and recovers what checkpoint selection buys — damping the late training drift
# — without withholding a partition to select on. Keep the window well inside
# total_epochs: the average retains d^total_epochs of the very first epoch's
# weights, which is 0.6% at 0.95 but 13.5% at 0.98 over 100 epochs.
#
# 0.95 is the default because it measured best: against the same run with raw
# final weights (exp_noema) it gained +0.026 gms and +0.014 precision_fg_pooled,
# both 5/5 folds, and a ~10-epoch window (0.9, exp_ema_0) was not enough.
ema_decay: 0.95
freeze_encoder: true
unfreeze_stages: null   # e.g. [3] to fine-tune only the deepest ConvNeXt stage
# How whole images are predicted, at validation and for the final predictions:
#   sliding_window  resolution x resolution windows, overlap 0.5, Gaussian blending
#   whole_image     one pass over the image, zero-padded to a multiple of 32, cropped back
# (Mask2Former's final predictions always use its own whole-image instance pass.)
inference: sliding_window

model:
  _target_: mltools.seg.models.DINOv3MAnet
  num_classes: 1

optimizer:
  lr: 1.0e-4
  encoder_lr: null   # null = same as lr; only used when the encoder is unfrozen
  weight_decay: 1.0
  encoder_weight_decay: null   # null = same as weight_decay; only used when the encoder is unfrozen

scheduler:
  _target_: mltools.seg.scheduler.get_cosine_schedule_with_warmup
  num_epochs: ${train.total_epochs}
  num_warmup_epochs: 5
  num_cycles: 0.5

loss:
  weight: 0.5
  labels_smoothing: 0.05
  # true (the setting every run so far used): labels_smoothing is applied to
  # the targets of both terms. false: only the BCE target is smoothed, the
  # Dice target stays binary (see SegLoss).
  smooth_dice_target: true
  # Area-weighted per-instance Dice (blob loss, Kofler et al. IPMI 2023), ADDED
  # to bce + pooled dice rather than replacing them. 0 disables it, so the
  # default loss is exactly what every run so far used.
  #   blob_weight           lambda; 1.0 matches the two global terms combined
  #   blob_area_exponent    0 = published blob loss (per-instance, unweighted),
  #                         0.5 = 1/sqrt(area), 1.0 = 1/area
  #   blob_min_area_fraction  clamps the weight of the smallest components;
  #                         5e-4 of the crop is ~151 px at 512x512, the 5th
  #                         percentile of knot area
  blob_weight: 0.0
  blob_area_exponent: 0.5
  blob_min_area_fraction: 5.0e-4

preprocessing:
  mask_image: null

augmentation:
  resolution: ${train.resolution}
  w2h_ratio: 1.0
  mosaic_p: 0.5
  mosaic_rotation: [-25, 25]   # mosaic branch; random_crop.rotation is the non-mosaic branch
  distortion:
    elastic:
      # normalized units, resolution-independent (see transforms.py), with
      # f = resolution * 0.02:
      #   true_sigma = sigma * f
      #   true_alpha = alpha * f**2
      # res  256 -> alpha  26.21, sigma  5.12
      # res  512 -> alpha 104.86, sigma 10.24
      # res 1024 -> alpha 419.43, sigma 20.48
      alpha: 1.0
      sigma: 1.0
    grid:
      num_steps: 5
      distort_limit: 0.3
    p: 0.85
    e2g_ratio: 1.0
  random_crop:
    scale: [1.0, 1.5]
    rotation: [-180, 180]
  # Rectangular occlusions punched into the image only — the mask keeps its
  # labels, so the model is trained to predict knots it cannot see. Values are
  # the ones that were hardcoded in transforms.py, so the defaults reproduce
  # every run made before this became configurable.
  coarse_dropout:
    num_holes: [1, 3]
    hole_height: [0.05, 0.15]   # fraction of the image height
    hole_width: [0.05, 0.15]    # fraction of the image width
    p: 0.4
  horizontal_flip:
    p: 0.5
  vertical_flip:
    p: 0.5
  color_jitter:
    brightness: 0.5
    contrast: 0.5
    saturation: 0.3
    hue: 0.1
    p: 0.9
  mask_vignette:
    steepness: 0
    midpoint: 0.2
